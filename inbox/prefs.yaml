# Search prefs v0 — freeze before ingest/ranker code grows.
# Honest-headline rules still live in CLAUDE.md; this file only says what to hunt.

geo:
  home: "Paphos, Cyprus"
  accept:
    - remote
    - EU
    - UK
    - Cyprus
    - EET
    - EEST
  reject:
    - US-only onsite
    - US visa not sponsored
    - relocation required
    - hybrid 2 days/week outside Cyprus  # London / Brussels office weeks = relocate

titles:
  # Honest headline can match the posting.
  core:
    - Data Governance Lead
    - Data Governance Team Lead
    - Data Governance Manager
    - Data Governance Specialist
    - Metadata Lead
    - Data Catalog
    - Data Discovery
    - Lineage
    - Data Quality Lead
    - Data Stewardship
    - Data Ownership
  # Tailor only after Yes; always flag gaps (Neurons Lab pattern).
  stretch:
    - Data Platform Lead
    - Analytics Enablement
    - AI enablement for data/analytics
    - AI governance
    - Data Quality practitioner / catalog professional services
  # Do not ping.
  skip:
    - CDO
    - VP Data
    - Head of Data
    - Staff Data Engineer
    - Spark IC
    - Technical AI Engagement
    - agentic coding
    - LLM gateway
    - Bedrock as the job
    - privacy attorney / legal privacy program
    - information-security controls / CISO-office GRC
    - sales / GTM / customer enablement
    - product manager of a governance *product* (unless we decide otherwise)

boost_terms:
  - metadata
  - lineage
  - catalog
  - data ownership
  - data contracts
  - BigQuery
  - dbt
  - GCP
  - Python
  - Airflow
  - MCP
  - data governance
  - stewardship
  - enablement

penalty_terms:
  - Snowflake
  - Databricks
  - Claude Code
  - Cursor
  - Codex as daily requirement
  - 20+ engineers
  - engineering-org AI adoption
  - iGaming
  - Collibra (or other vendor) product champion as a hard requirement
  - no visa sponsorship + US remote

# Title-matcher pitfalls from 2026-08-18 smoke test — do not treat as core:
# - "enablement" alone → sales/GTM/L&D
# - "government" → US public-sector support, not governance
# - "catalog" in Unity Catalog SWE titles
# - "Engagement Manager" → professional-services delivery, not DG lead

