schema: spec-driven

context: |
  cv-generator turns structured candidate evidence plus a job description into a
  one-page CV, appendix, cover letter, and plain-text CV.

  Stack: Node.js ESM (no build step), js-yaml, marked, pdf-lib, puppeteer.
  Entry points: build.mjs, scripts/ (init-workspace, rebuild, ingest, privacy-audit),
  templates/, test/ (node --test).

  Verification: `node build.mjs <slug> [--workspace <path>]`, `npm test`,
  `npm run audit:public`. PDFs need visual review after template/layout changes.

  Hard constraints (see CLAUDE.md):
  - Workspace boundary: real candidate data lives only in .cv-local/ or an external
    workspace; never in examples, tests, fixtures, comments, or docs.
  - Truthfulness: every tailored claim must trace to profile.yaml or data/evidence/.
  - Sanitization: no colleague names, ticket keys, internal URLs, repo names, or
    codenames in generated artifacts.

